<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - VIT Bus</title>
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .chat-container {
            height: calc(100vh - 200px);
        }
    </style>
</head>

<body class="bg-gray-100 flex flex-col h-screen">

    <!-- Header -->
    <header class="text-gray-600 body-font bg-white shadow">
        <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
            <a href="{{ url_for('home') }}" class="flex title-font font-medium items-center text-gray-900 mb-4 md:mb-0">
                <span class="ml-3 text-xl">VIT Bus AI Assistant</span>
            </a>
            <nav class="md:ml-auto flex flex-wrap items-center text-base justify-center">
                <a href="{{ url_for('home') }}" class="mr-5 hover:text-gray-900">Back to Home</a>
            </nav>
        </div>
    </header>

    <!-- Chat Area -->
    <div class="container mx-auto p-4 flex-grow flex flex-col">
        <div id="chat-box" class="flex-grow bg-white p-4 rounded shadow overflow-y-auto mb-4 space-y-4">
            <!-- Messages will appear here -->
            <div class="flex items-start">
                <div class="bg-gray-200 p-3 rounded-lg text-sm text-gray-900 max-w-xs">
                    Hello! I'm the VIT Bus AI. Ask me about bus routes or schedules! 🚌
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="flex">
            <input type="text" id="user-input"
                class="flex-grow p-3 border rounded-l focus:outline-none focus:ring-2 focus:ring-indigo-500"
                placeholder="Type your question..." maxlength="500" onkeydown="handleEnter(event)">
            <button onclick="sendMessage()"
                class="bg-indigo-500 text-white p-3 rounded-r hover:bg-indigo-600 transition">Send</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const input = document.getElementById('user-input');

        // Messages are added with textContent, never innerHTML, so nothing the
        // user types or the model returns can run as markup or script.
        function addMessage(text, kind) {
            const styles = {
                user: ['flex items-end justify-end', 'bg-indigo-500 text-white'],
                bot: ['flex items-start', 'bg-gray-200 text-gray-900'],
                loading: ['flex items-start', 'bg-gray-200 text-gray-500 animate-pulse'],
                error: ['flex items-start', 'bg-red-100 text-red-700'],
            }[kind];
            const row = document.createElement('div');
            row.className = styles[0];
            const bubble = document.createElement('div');
            bubble.className = `${styles[1]} p-3 rounded-lg text-sm max-w-xs whitespace-pre-wrap`;
            bubble.textContent = text;
            row.append(bubble);
            chatBox.append(row);
            chatBox.scrollTop = chatBox.scrollHeight;
            return row;
        }

        let busy = false;

        async function sendMessage() {
            const message = input.value.trim();
            if (!message || busy) return;

            busy = true;
            addMessage(message, 'user');
            input.value = '';
            const loading = addMessage('Thinking...', 'loading');

            try {
                const response = await fetch("{{ url_for('chat_api') }}", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message }),
                });
                const data = await response.json();
                loading.remove();
                addMessage(data.response || 'No response received.', response.ok ? 'bot' : 'error');
            } catch (error) {
                loading.remove();
                addMessage('Sorry, I encountered an error. Please try again.', 'error');
            } finally {
                busy = false;
                input.focus();
            }
        }

        function handleEnter(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>

</html>
