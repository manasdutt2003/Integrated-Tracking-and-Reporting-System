<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Bus Details - VIT Bus Management</title>
    <link href="https://unpkg.com/tailwindcss@^1.0/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 text-gray-700">
    <header class="bg-white shadow">
        <div class="container mx-auto flex flex-wrap p-5 items-center justify-between">
            <a href="{{ url_for('home') }}" class="text-xl font-medium text-gray-900">VIT BUS MANAGEMENT</a>
            <nav>
                <a href="{{ url_for('home') }}" class="mr-5 hover:text-gray-900">Home</a>
                <a href="{{ url_for('chat') }}" class="hover:text-gray-900">Chat with AI</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto p-5">
        <h1 class="text-2xl font-medium text-gray-900 mb-4">Find your bus</h1>

        <form id="search-bus" class="flex mb-2" role="search">
            <label for="search" class="sr-only">Search by route number, area or vehicle number</label>
            <input type="search" name="search" id="search" autofocus
                placeholder="Route number, area or vehicle number"
                class="flex-grow p-3 border rounded-l focus:outline-none">
            <button name="search_btn" class="bg-indigo-500 text-white px-4 hover:bg-indigo-600">Search</button>
            <button name="reset" type="reset" class="bg-gray-300 px-4 rounded-r hover:bg-gray-400">Reset</button>
        </form>
        <p id="result-count" class="text-sm text-gray-600 mb-4" aria-live="polite"></p>

        <div class="bg-white rounded shadow overflow-x-auto">
            <table class="w-full text-left">
                <thead class="bg-gray-200 text-gray-900">
                    <tr>
                        <th class="p-3">Route</th>
                        <th class="p-3">Area</th>
                        <th class="p-3">Vehicle</th>
                        <th class="p-3">Live tracking</th>
                    </tr>
                </thead>
                <tbody id="bus-rows"></tbody>
            </table>
        </div>
    </main>

    <script>
        const rows = document.getElementById('bus-rows');
        const count = document.getElementById('result-count');
        const form = document.getElementById('search-bus');
        const input = document.getElementById('search');
        let buses = [];

        function cell(text) {
            const td = document.createElement('td');
            td.className = 'p-3 border-t';
            td.textContent = text;
            return td;
        }

        function render(list) {
            rows.replaceChildren();
            for (const bus of list) {
                const tr = document.createElement('tr');
                tr.append(cell(bus.route_number), cell(bus.route), cell(bus.vehicle_number));

                const linkCell = cell('');
                if (bus.tracking_link) {
                    const link = document.createElement('a');
                    link.href = bus.tracking_link;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.className = 'text-indigo-600 hover:underline';
                    link.textContent = 'Track bus';
                    linkCell.append(link);
                } else {
                    linkCell.textContent = 'Not available';
                    linkCell.classList.add('text-gray-500');
                }
                tr.append(linkCell);
                rows.append(tr);
            }
            count.textContent = list.length === buses.length
                ? `${buses.length} buses`
                : `${list.length} of ${buses.length} buses match`;
        }

        // Every word typed must appear somewhere in the row. Plain substring
        // matching, so characters like "(" or "*" cannot break the search.
        function filterBuses() {
            const tokens = input.value.toLowerCase().split(/\s+/).filter(Boolean);
            render(buses.filter((bus) => {
                const haystack = [bus.route_number, bus.route, bus.vehicle_number].join(' ').toLowerCase();
                const compact = haystack.replace(/\s+/g, '');
                return tokens.every((token) => haystack.includes(token) || compact.includes(token));
            }));
        }

        input.addEventListener('input', filterBuses);
        form.addEventListener('submit', (event) => { event.preventDefault(); filterBuses(); });
        form.addEventListener('reset', () => setTimeout(filterBuses));

        fetch("{{ url_for('buses_api') }}")
            .then((response) => {
                if (!response.ok) throw new Error(response.status);
                return response.json();
            })
            .then((data) => { buses = data; filterBuses(); })
            .catch(() => { count.textContent = 'Could not load the bus list. Please refresh the page.'; });
    </script>
</body>

</html>
